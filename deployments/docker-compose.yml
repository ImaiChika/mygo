services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: mygo-frontend
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mygo-app
    environment:
      APP_NAME: mygo
      APP_ENV: docker
      HTTP_ADDR: :8080
      POSTGRES_ENABLED: "true"
      POSTGRES_DSN: postgres://mygo:mygo@postgres:5432/mygo?sslmode=disable
      POSTGRES_MAX_CONNS: "10"
      POSTGRES_MIN_CONNS: "2"
      REDIS_ENABLED: "true"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      AUTH_ACCESS_SECRET: mygo-super-secret
      AUTH_COLLAB_SECRET: mygo-collab-secret
      AUTH_ACCESS_TTL: 24h
      STORAGE_UPLOAD_DIR: /app/uploads
      STORAGE_PUBLIC_BASE_URL: http://127.0.0.1:5173
      STORAGE_MAX_FILE_SIZE: "10485760"
      WS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16
    container_name: mygo-postgres
    environment:
      POSTGRES_DB: mygo
      POSTGRES_USER: mygo
      POSTGRES_PASSWORD: mygo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mygo -d mygo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: mygo-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  uploads_data:
